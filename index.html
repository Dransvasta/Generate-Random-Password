<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Document</title>
</head>
<body>
     <header class="head">
        <img src="src/Rlogo.png" >
        <p>RPG</p>
     </header>
     <div class="content">
        <div class="container">
        <div class="Gradient" id="Gradient">
        <div class="block" id="block">
         <div class="text-an">
         <h1 id="rand">Random Password Generator</h1>
         <h1 id="passw">Your Password is </h1>
         </div>
         <div style="display: flex;">
         <h1 id="answ">fasbfasbfaj</h1>
         <h1 id="answ1">fasbfasbfaj</h1>
         </div>
        <div class="button-green">
         <button id ='button1' class="animated-button" onclick="GenerateRandomPassword()">
            <svg viewBox="0 0 24 24" class="arr-2" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
              ></path>
            </svg>
            <span class="text">Generate</span>
            <span class="circle"></span>
            <svg viewBox="0 0 24 24" class="arr-1" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
              ></path>
            </svg>
          </button>
        </div>

          
        </div>
        </div>
        <div class="sidebar">
          <div id="checklist">
            <input checked="" value="1" name="r" type="checkbox" id="01">
            <label for="01">No whitespaces</label>
            <input value="2" name="r" type="checkbox" id="02">
            <label for="02">Special characters</label>
            <input value="3" name="r" type="checkbox" id="03">
            <label for="03">Digits</label>
            <div class="dd" id="dd">></div>
          </div>
        </div>
        </div>
        <div class="db" id="db">
          <div class="ua" id="ua">^</div>
          <label for="length">Length</label>
          <input type="text" id="length" value="10">
        </div>
      </div>
     <script>
      function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
    }
      document.getElementById('Gradient').addEventListener('mouseover',function(event){
         document.getElementById('Gradient').style.animationPlayState='paused';
         });
      document.getElementById('Gradient').addEventListener('mouseout',function(event){
         document.getElementById('Gradient').style.animationPlayState='running';

      });
      /* Set the width of the side navigation to 250px */
var sidebartoggle=1;
var firstan=0;
var time1=0;
var funran=0;
document.getElementById('dd').addEventListener('click',function(event){
  if(sidebartoggle==1){
    this.innerHTML='<';
    document.getElementById('checklist').style.transform='translate(230px,0px)';
    sidebartoggle=0;
  }
  else{
    this.innerHTML='>';
    document.getElementById('checklist').style.transform='translate(0px,0px)';
    sidebartoggle=1;
  }
});
var scrolled=0;
document.getElementById('ua').addEventListener('click',function(){
  if(scrolled==0){
  this.innerHTML='v';
 document.getElementById('db').classList.add('scrolled');
 scrolled=1;
  }
  else{
    this.innerHTML='^';
 document.getElementById('db').classList.remove('scrolled');
 scrolled=0;
  }
});
function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}
async function GenerateRandomPassword(){
  if(funran==1)
{
  return;
}
 funran=1;
  
  if(firstan==0)
{
  console.log("hi");
  document.getElementById('passw').style.transform="translate(0,0)";
  document.getElementById('rand').style.transform="translate(-80vw,0)";
}
  var alpha="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"
  var spaces="           ";
  var spec ='!"#$%&()*+,-./:;<=>?@[\]^_`{|}~';
  var digits='0123456789';
  var re=""+alpha
  if(!document.getElementById('01').checked)
{
  re+=spaces;
}
 if(document.getElementById('02').checked)
 {
  console.log('sfafasfas');
  re+=spec;
 }
 if(document.getElementById('03').checked)
 {
  re=digits+re+digits;
 }
  var result=""
  var i=0;
  var n = document.getElementById('length').value;
  i=0;
  
  console.log(re);
  while(i<n){
    var randomi=getRandomInt(0,re.length-1);
    result+=re[randomi];
    i+=1;
  }
  if(firstan==0)
  {
    firstan=1;
    ansfield=document.getElementById('answ');
    ansfield.innerHTML=result;
    ansfield.style.transform="translate(-2vw,0)"  
  }
  else{
    ansfield1=document.getElementById('answ');
    ansfield2=document.getElementById('answ1');
    ansfield2.innerHTML=result;
    ansfield1.style.transform="translate(-77vw,0)";
    ansfield2.style.transform="translate(-2vw,0)";
    
    await sleep(2500);
    ansfield2.style.transition = 'none';
    ansfield1.style.transition = 'none';
    ansfield1.innerHTML=result;
    ansfield1.style.transform="translate(-2vw,0)";
    ansfield2.style.transform="translate(77vw,0)";
    await sleep(5);
    ansfield2.style.transition = 'all 2s ease';
    ansfield1.style.transition = 'all 2s ease';
    time1=0;
  }
  funran=0;
}
   </script>
